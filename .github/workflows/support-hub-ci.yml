name: Support Hub CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/build-release-candidate.ps1'
      - 'scripts/publish-iis.ps1'
      - 'scripts/smoke-test-release-candidate.ps1'
      - 'scripts/verify-offline-runtime.ps1'
      - 'scripts/verify-release-candidate.ps1'
      - 'scripts/verify-riyal-asset.ps1'
      - 'docs/release/**'
      - '.ai/scripts/**'
      - '.github/workflows/support-hub-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/build-release-candidate.ps1'
      - 'scripts/publish-iis.ps1'
      - 'scripts/smoke-test-release-candidate.ps1'
      - 'scripts/verify-offline-runtime.ps1'
      - 'scripts/verify-release-candidate.ps1'
      - 'scripts/verify-riyal-asset.ps1'
      - 'docs/release/**'
      - '.ai/scripts/**'
      - '.github/workflows/support-hub-ci.yml'

permissions:
  contents: read

jobs:
  support-hub:
    name: Support Hub backend/frontend and release candidate
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.302'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore backend
        shell: pwsh
        run: dotnet restore backend/RmsSupportHub.slnx --nologo

      - name: Build backend Release with warnings as errors
        shell: pwsh
        run: dotnet build backend/RmsSupportHub.slnx -c Release --no-restore --nologo --warnaserror

      - name: Run full backend Release tests
        shell: pwsh
        run: dotnet test backend/RmsSupportHub.slnx -c Release --no-build --no-restore --nologo

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Run full frontend tests
        shell: pwsh
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build frontend production assets
        shell: pwsh
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Verify approved Riyal asset
        shell: pwsh
        working-directory: frontend
        run: npm run test:riyal-asset

      - name: Run PowerShell quality gate
        shell: pwsh
        run: .\scripts\test-powershell-quality.ps1

      - name: Run repository memory and diff quality checks
        shell: pwsh
        run: |
          python .ai/scripts/context.py
          python .ai/scripts/check_memory.py
          git diff --check

      - name: Generate and fresh-extraction verify Testing release candidate
        shell: pwsh
        run: .\scripts\build-release-candidate.ps1 -SkipDependencyInstall

      - name: Run packaged runtime smoke test
        shell: pwsh
        run: .\scripts\smoke-test-release-candidate.ps1 -PackageRoot .\publish\verification
