name: POS CI

on:
  push:
    branches: [main]
    paths:
      - "pos/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src/app/core/pos-agent/**"
      - "tools/pos-agent-client-generator/**"
      - "scripts/generate-pos-agent-client.*"
      - ".github/workflows/pos-ci.yml"
  pull_request:
    paths:
      - "pos/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src/app/core/pos-agent/**"
      - "tools/pos-agent-client-generator/**"
      - "scripts/generate-pos-agent-client.*"
      - ".github/workflows/pos-ci.yml"

permissions:
  contents: read

jobs:
  portable:
    name: POS portable projects
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.302"

      - name: Restore portable projects
        run: |
          dotnet restore pos/src/RmsSupportHub.Pos.Domain/RmsSupportHub.Pos.Domain.csproj --nologo
          dotnet restore pos/src/RmsSupportHub.Pos.Application/RmsSupportHub.Pos.Application.csproj --nologo
          dotnet restore pos/src/RmsSupportHub.Pos.Contracts/RmsSupportHub.Pos.Contracts.csproj --nologo
          dotnet restore pos/tests/RmsSupportHub.Pos.Domain.Tests/RmsSupportHub.Pos.Domain.Tests.csproj --nologo
          dotnet restore pos/tests/RmsSupportHub.Pos.Application.Tests/RmsSupportHub.Pos.Application.Tests.csproj --nologo

      - name: Build portable projects and tests
        run: |
          dotnet build pos/src/RmsSupportHub.Pos.Domain/RmsSupportHub.Pos.Domain.csproj -c Release --no-restore --nologo --warnaserror
          dotnet build pos/src/RmsSupportHub.Pos.Application/RmsSupportHub.Pos.Application.csproj -c Release --no-restore --nologo --warnaserror
          dotnet build pos/src/RmsSupportHub.Pos.Contracts/RmsSupportHub.Pos.Contracts.csproj -c Release --no-restore --nologo --warnaserror
          dotnet build pos/tests/RmsSupportHub.Pos.Domain.Tests/RmsSupportHub.Pos.Domain.Tests.csproj -c Release --no-restore --nologo --warnaserror
          dotnet build pos/tests/RmsSupportHub.Pos.Application.Tests/RmsSupportHub.Pos.Application.Tests.csproj -c Release --no-restore --nologo --warnaserror

      - name: Run portable tests
        run: |
          dotnet test pos/tests/RmsSupportHub.Pos.Domain.Tests/RmsSupportHub.Pos.Domain.Tests.csproj -c Release --no-build --no-restore --nologo
          dotnet test pos/tests/RmsSupportHub.Pos.Application.Tests/RmsSupportHub.Pos.Application.Tests.csproj -c Release --no-build --no-restore --nologo

  windows:
    name: POS Windows build and Infrastructure tests
    runs-on: windows-latest
    env:
      PosAgentSecurity__SupportHubOrigin: https://support-hub.integration.test
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.302"

      - name: Restore POS solution
        run: dotnet restore pos/RmsSupportHub.Pos.slnx --nologo

      - name: Build POS solution
        run: dotnet build pos/RmsSupportHub.Pos.slnx -c Release --no-restore --nologo --warnaserror

      - name: Run Infrastructure tests
        run: dotnet test pos/tests/RmsSupportHub.Pos.Infrastructure.Tests/RmsSupportHub.Pos.Infrastructure.Tests.csproj -c Release --no-build --no-restore --nologo

  agent-security:
    name: Windows Agent security foundation
    runs-on: windows-latest
    env:
      PosAgentSecurity__SupportHubOrigin: https://support-hub.integration.test
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.302"

      - name: Restore Agent foundation
        run: dotnet restore pos/tests/RmsSupportHub.Pos.Agent.IntegrationTests/RmsSupportHub.Pos.Agent.IntegrationTests.csproj --nologo

      - name: Build Agent foundation and tests
        run: |
          dotnet build pos/src/RmsSupportHub.Pos.Agent/RmsSupportHub.Pos.Agent.csproj -c Release --no-restore --nologo --warnaserror
          dotnet build pos/tests/RmsSupportHub.Pos.Agent.IntegrationTests/RmsSupportHub.Pos.Agent.IntegrationTests.csproj -c Release --no-restore --nologo --warnaserror

      - name: Run Agent security tests
        run: dotnet test pos/tests/RmsSupportHub.Pos.Agent.IntegrationTests/RmsSupportHub.Pos.Agent.IntegrationTests.csproj -c Release --no-build --no-restore --nologo

  contract-generation:
    name: POS OpenAPI and Angular contract generation
    runs-on: windows-latest
    env:
      PosAgentSecurity__SupportHubOrigin: https://support-hub.integration.test
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.302"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/pos-agent-client-generator/package-lock.json

      - name: Restore and build Agent contract source
        run: |
          dotnet restore pos/src/RmsSupportHub.Pos.Agent/RmsSupportHub.Pos.Agent.csproj --nologo
          dotnet build pos/src/RmsSupportHub.Pos.Agent/RmsSupportHub.Pos.Agent.csproj -c Release --no-restore --nologo --warnaserror

      - name: Install isolated generator dependencies
        run: npm ci
        working-directory: tools/pos-agent-client-generator

      - name: Install Support Hub dependencies
        run: npm ci
        working-directory: frontend

      - name: Regenerate Support Hub Agent types
        run: npm run generate:pos-agent-client
        working-directory: frontend

      - name: Fail on stale contract artifacts
        run: git diff --exit-code -- pos/openapi/RmsSupportHub.Pos.Agent.json frontend/src/app/core/pos-agent/generated/pos-agent-api.generated.ts

  winui-publish:
    name: Retained WinUI publish validation
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.302"

      - name: Restore WinUI project
        run: dotnet restore pos/src/PosAdminTool.WinUI/PosAdminTool.WinUI.csproj --nologo

      - name: Publish retained WinUI parity baseline
        run: dotnet publish pos/src/PosAdminTool.WinUI/PosAdminTool.WinUI.csproj -c Release -r win-x64 --self-contained false --no-restore --nologo

      - name: Verify executable and XAML resources
        shell: pwsh
        run: |
          $publish = Join-Path $env:GITHUB_WORKSPACE 'pos/src/PosAdminTool.WinUI/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish'
          if (-not (Test-Path -LiteralPath (Join-Path $publish 'PosAdminTool.WinUI.exe'))) {
            throw "WinUI executable was not published: $publish"
          }
          if (-not (Get-ChildItem -LiteralPath $publish -Recurse -File -Filter '*.pri')) {
            throw "No .pri XAML resource was published: $publish"
          }
          if (-not (Get-ChildItem -LiteralPath $publish -Recurse -File -Filter '*.xbf')) {
            throw "No .xbf compiled XAML resource was published: $publish"
          }
